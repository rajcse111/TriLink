<div class="auth-page" style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/trilink-logo.svg" alt="TriLink Logo" style="height:56px;margin-bottom:8px">
      <h1 style="color:#1a1a2e">Admin Portal</h1>
      <p>TriLink Referral Network</p>
    </div>

    @if (error) { <div class="alert error">{{ error }}</div> }

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Admin Email</mat-label>
      <mat-icon matPrefix>admin_panel_settings</mat-icon>
      <input matInput [(ngModel)]="email" type="email" />
    </mat-form-field>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Password</mat-label>
      <mat-icon matPrefix>lock</mat-icon>
      <input matInput [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" (keyup.enter)="login()" />
      <button mat-icon-button matSuffix (click)="showPassword=!showPassword" type="button">
        <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <button mat-raised-button color="primary" class="full-width" style="height:48px;font-size:1rem;background:#1a1a2e;color:#fff"
      (click)="login()" [disabled]="loading">
      @if (loading) { <mat-spinner diameter="20" style="display:inline-block;margin-right:8px"></mat-spinner> }
      Admin Login
    </button>

    <div style="text-align:center;margin-top:20px;font-size:.85rem">
      <a routerLink="/login" style="color:#9e9e9e">← Member Login</a>
    </div>
  </div>
</div>
